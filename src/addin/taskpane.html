<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SendShield</title>
    <link rel="stylesheet" href="taskpane.css?v=__VERSION__">
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script type="text/javascript" src="core.js?v=__VERSION__" defer></script>
    <script type="text/javascript" src="runtime.js?v=__VERSION__" defer></script>
    <script type="text/javascript" src="taskpane.js?v=__VERSION__" defer></script>
</head>
<body>
    <header class="top">
        <img src="assets/sendshield-32.png" alt="" width="24" height="24">
        <h1>SendShield</h1>
    </header>

    <main id="app">
        <p class="muted" id="loading">Checking recipients…</p>

        <section id="externals" hidden>
            <p id="intro" class="intro"></p>
            <div class="section-head">
                <h2>External recipients <span class="count" id="ext-count"></span></h2>
                <label class="select-all"><input type="checkbox" id="select-all"> Select all</label>
            </div>
            <ul id="recipient-list" class="list"></ul>
        </section>

        <section id="attachments" hidden>
            <div class="section-head">
                <h2>Attachments <span class="count" id="att-count"></span></h2>
            </div>
            <ul id="attachment-list" class="list plain"></ul>
            <label class="check-row">
                <input type="checkbox" id="attachments-ok">
                <span>I have checked these attachments are correct to send outside Toluna.</span>
            </label>
        </section>

        <div id="actions" hidden>
            <button type="button" id="confirm" class="primary" disabled>Confirm</button>
            <p class="muted small" id="progress"></p>
        </div>

        <div id="status" class="status" role="status" hidden></div>
        <p id="none" class="ok-msg" hidden>No external recipients. Nothing to confirm.</p>
        <p id="legacy" class="warn-msg" hidden>Your Outlook version can't store confirmations. When you click Send you'll get a dialog asking you to confirm instead.</p>
    </main>

    <footer class="foot muted small">
        <span id="internal-summary"></span>
        <span>v__VERSION__</span>
    </footer>
</body>
</html>
